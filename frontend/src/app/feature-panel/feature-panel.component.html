<mat-card class="panel">
  <div class="panel__header">
    <h2 class="panel__title">Variabilidade (LPS)</h2>
    <p class="panel__subtitle">Back-end e modo de execução</p>
  </div>

  <mat-card-content>
    <section>
      <h3>Back-end de compilação</h3>
      <mat-radio-group
        aria-label="Back-end de compilação"
        [value]="targetVariability()"
        (change)="onTargetChange($event.value)"
      >
        @for (t of targets(); track t.value) {
          <mat-radio-button class="option" [value]="t.value">
            {{ t.label }}
          </mat-radio-button>
        }
      </mat-radio-group>
    </section>

    <section>
      <h3>Modo de execução</h3>
      <mat-radio-group
        aria-label="Modo de execução"
        [value]="executionMode()"
        (change)="onExecutionChange($event.value)"
      >
        @for (e of executions; track e.value) {
          <mat-radio-button class="option" [value]="e.value">
            {{ e.label }}
          </mat-radio-button>
        }
      </mat-radio-group>
    </section>

    <p class="panel__hint">
      <mat-icon aria-hidden="true">info</mat-icon>
      <span class="panel__hint-text">
        Use <strong>Executar</strong> no editor ou <kbd>Ctrl</kbd>+<kbd>Enter</kbd>.
      </span>
    </p>
  </mat-card-content>
</mat-card>
